  <defs>
    <linearGradient id="bg" x1="18" y1="12" x2="110" y2="116" gradientUnits="userSpaceOnUse"><stop stop-color="#182b3b"/><stop offset="1" stop-color="#070d18"/></linearGradient>
    <linearGradient id="cube" x1="32" y1="25" x2="96" y2="101" gradientUnits="userSpaceOnUse"><stop stop-color="#58e3eb"/><stop offset=".52" stop-color="#25a9c2"/><stop offset="1" stop-color="#12627f"/></linearGradient>
