<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080e17">
  <meta name="description" content="十道空间谜题。翻滚改变姿态，点亮日月符文，留下回声，逃离十层密室。">
  <title>滚动方块 · 十层密室</title>
  <link rel="stylesheet" href="game.css?v=audio-1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <script defer src="escape-background.js?v=cover-1"></script>
  <script defer src="game-core.js"></script>
  <script defer src="levels.js"></script>
  <script defer src="game-renderers.js"></script>
  <script defer src="game-audio.js?v=audio-1"></script>
  <script defer src="game-app.js?v=audio-1"></script>
</head>
<body data-renderer="canvas">
  <main class="shell">
    <header class="site-head">
      <div class="brand"><span>◇</span>滚动方块 <span class="edition">/ 十层密室</span></div>
      <div class="header-actions"><button id="btn-audio" class="quiet" title="音乐、音效与其他设置">♫ 声音</button><button id="btn-home" class="quiet">首页</button></div>
    </header>
    <div class="toolbar">
      <div class="level-info">
        <div class="progress-line"><span id="chapter-display">石牢密室</span><strong id="level-display">01 / 10</strong></div>
        <h2 id="level-name">苏醒之室</h2>
      </div>
      <div class="step-chip"><b id="moves-display">0</b><span>本关步数</span></div>
      <div class="toolbar-actions">
        <button id="btn-undo" title="撤销 (Z)">↶ 撤销</button>
        <button id="btn-restart" title="重试本关 (R)">↻ 重试</button>
        <button id="btn-hint">✧ 提示</button>
        <button id="btn-levels">▦ 关卡</button>
      </div>
    </div>
    <section id="game-container" class="board" tabindex="-1" aria-label="翻滚棋盘，可在此滑动操作">
      <div class="board-tags">
        <span class="board-tag" id="pose-display">☾ 脚端朝下</span>
        <span class="board-tag" id="seal-display" hidden></span>
        <span class="board-tag echo" id="echo-display" hidden></span>
      </div>
      <div class="direction-guide"><b>↑ / W · 远侧　　← / A · 左侧</b><br>→ / D · 右侧　　↓ / S · 近侧</div>
      <canvas id="confetti-canvas" aria-hidden="true"></canvas>
      <div id="modal-layer" class="modal-layer" role="dialog" aria-modal="true">
        <div id="modal-panel" class="modal"><h2>十层密室</h2><p>正在准备棋盘…</p></div>
      </div>
      <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
    </section>
    <div class="lesson-bar"><span>◇</span><span id="lesson-text">横躺占两格，竖立占一格。</span></div>
    <div class="below-board">
      <p class="instructions">方向键 / WASD 或滑动翻滚<br><kbd>Z</kbd> 撤销　<kbd>R</kbd> 重试　无需抢时间</p>
      <div id="dpad" class="dpad" aria-label="翻滚方向按钮" hidden>
        <button data-direction="UP" aria-label="向上翻滚">↑</button>
        <button data-direction="LEFT" aria-label="向左翻滚">←</button>
        <button data-direction="DOWN" aria-label="向下翻滚">↓</button>
        <button data-direction="RIGHT" aria-label="向右翻滚">→</button>
      </div>
    </div>
    <footer class="footer"><span id="edition">十层密室</span>　·　让每一次翻滚都有方向</footer>
  </main>
</body>
</html>
